name: MKK-Daten aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_mkk.py
      - name: Änderungen speichern
        run: |
          git config user.name "mkk-hygiene-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/entries.json
          git diff --cached --quiet && exit 0
          git commit -m "Aktualisiere MKK-Hygienedaten"
          git push
